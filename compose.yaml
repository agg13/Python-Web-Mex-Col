services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taller_store
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: taller_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller_user -d taller_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

